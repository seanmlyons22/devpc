---

# macOS system settings, applied with `defaults write` so a new machine does not
# have to be clicked through System Settings.
#
# HOW THIS LIST WAS BUILT: every entry below was read off a real machine with
# `defaults read <domain> <key>`. Keys that read back as unset are NOT listed --
# unset means "macOS stock default", and writing the stock value explicitly just
# adds noise. Note the converse is not guaranteed: a key being present in a plist
# does not prove you changed it deliberately, since macOS writes some of its own
# defaults out. This list is "what your plists explicitly contain", not "what you
# changed", because the stock values are not introspectable.
#
# `type` must match what `defaults read-type` reports, or the module rewrites the
# key on every run and the role stops being idempotent.
#
# `restart` is optional and names the process to kill so the change takes effect.
# Only apps whose settings actually changed get restarted.

macos_defaults_settings:

  # --- Dock ---
  - domain: com.apple.dock
    key: autohide
    type: bool
    value: true
    restart: Dock
  - domain: com.apple.dock
    key: orientation
    type: string
    value: left
    restart: Dock
  # Hot corner, bottom-right. 14 = Quick Note.
  - domain: com.apple.dock
    key: wvous-br-corner
    type: int
    value: 14
    restart: Dock

  # --- Finder desktop icons ---
  - domain: com.apple.finder
    key: ShowExternalHardDrivesOnDesktop
    type: bool
    value: true
    restart: Finder
  - domain: com.apple.finder
    key: ShowHardDrivesOnDesktop
    type: bool
    value: false
    restart: Finder
  - domain: com.apple.finder
    key: ShowRemovableMediaOnDesktop
    type: bool
    value: true
    restart: Finder

  # --- Text input ---
  - domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: true
  - domain: NSGlobalDomain
    key: NSAutomaticPeriodSubstitutionEnabled
    type: bool
    value: true

  # Full keyboard access: Tab moves between all controls, not just text fields.
  - domain: NSGlobalDomain
    key: AppleKeyboardUIMode
    type: int
    value: 2

  # false = "natural" scrolling OFF, i.e. content moves opposite to fingers.
  - domain: NSGlobalDomain
    key: com.apple.swipescrolldirection
    type: bool
    value: false

  # --- Trackpad ---
  # Both domains are set deliberately: the AppleBluetoothMultitouch one covers
  # external Magic Trackpads, the other the built-in one. macOS keeps them
  # separate, so setting only one leaves the other device unconfigured.
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking              # tap-to-click off. NOTE: integer, not bool.
    type: int
    value: 0
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: TrackpadThreeFingerDrag
    type: bool
    value: false
  - domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: TrackpadRightClick
    type: bool
    value: true
  - domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: int
    value: 0
  - domain: com.apple.AppleMultitouchTrackpad
    key: TrackpadThreeFingerDrag
    type: bool
    value: false
  - domain: com.apple.AppleMultitouchTrackpad
    key: TrackpadRightClick
    type: bool
    value: true

  # --- Menu bar clock ---
  - domain: com.apple.menuextra.clock
    key: ShowDayOfWeek
    type: bool
    value: true
    restart: SystemUIServer
  - domain: com.apple.menuextra.clock
    key: ShowDate
    type: int
    value: 0
    restart: SystemUIServer

  # --- Window manager / privacy ---
  # Clicking the wallpaper does NOT sweep windows aside to reveal the desktop.
  - domain: com.apple.WindowManager
    key: EnableStandardClickToShowDesktop
    type: bool
    value: false
  - domain: com.apple.AdLib
    key: allowApplePersonalizedAdvertising
    type: bool
    value: false

# Language and region. Split out because rewriting these is more disruptive than
# the rest -- it changes system-wide language fallback order. Set
# macos_defaults_apply_locale=false to skip.
macos_defaults_apply_locale: true
macos_locale_settings:
  - domain: NSGlobalDomain
    key: AppleLanguages
    type: array
    value: ["en-US", "nb-US"]
  - domain: NSGlobalDomain
    key: AppleLocale
    type: string
    value: en_US

# Computer name. Needs sudo, which would cost the macOS run its
# no-password-required property, so it is opt-in.
# Enable with: -e macos_set_computer_name=true
macos_set_computer_name: false
macos_computer_name: "Sean's Mac mini"
macos_local_host_name: "Seans-Mac-mini"
